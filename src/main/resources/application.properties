# Server Configuration
server.port=8080
spring.application.name=campaignpro-backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://velshanth_db_user:velshanth_db_user@cluster0.wgtbufq.mongodb.net/campaignpro?retryWrites=true&w=majority}

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=900000

# Email Configuration (Resend SDK - Test Mode)
resend.api.key=${RESEND_API_KEY}
email.from=${EMAIL_FROM:onboarding@resend.dev}
email.test.recipient=${EMAIL_TEST_RECIPIENT:delivered@resend.dev}
email.test.useReal=${EMAIL_USE_REAL:false}

# CORS Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Application URL for tracking
app.url=${APP_URL:http://localhost:8080}

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.campaignpro=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
