# Server Configuration
server.port=${PORT:8080}
spring.application.name=campaignpro-backend

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}

# Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=9000000

# Email Configuration (Java Mail API - SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:campaignproav@gmail.com}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.ssl.trust=*
email.from=${EMAIL_FROM:campaignproav@gmail.com}

# CORS Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173}

# Application URL for tracking
app.url=${APP_URL:http://localhost:8080}

# Spring Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.campaignpro=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
